name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Release tag v$RELEASE_VERSION does not match package version $PACKAGE_VERSION."
            echo "Create a new GitHub release tag that matches pyproject.toml, for example v$PACKAGE_VERSION."
            exit 1
          fi

      - run: python -m pip install --upgrade build
      - run: rm -rf dist build runtimekit_cli.egg-info
      - run: python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
